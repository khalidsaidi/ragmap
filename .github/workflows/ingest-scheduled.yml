# Optional: run ingest on a schedule (e.g. daily) without Cloud Scheduler.
# Free for public repos. Add repo secrets: INGEST_TOKEN, API_BASE_URL (Cloud Run URL, not web.app)
name: ingest-scheduled

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Ingest mode
        required: false
        default: incremental
        type: choice
        options:
          - incremental
          - full

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger incremental ingest
        run: |
          set -euo pipefail
          BASE="${{ secrets.API_BASE_URL }}"
          BASE="${BASE%/}"
          MODE="${{ inputs.mode || 'incremental' }}"
          MAX_TIME=600
          if [[ "$MODE" == "full" ]]; then
            MAX_TIME=1800
          fi
          echo "API_BASE_URL=$BASE"
          echo "MODE=$MODE"
          echo "MAX_TIME=$MAX_TIME"

          status=0
          code=""
          set +e
          code=$(curl --fail-with-body -sS -X POST "$BASE/internal/ingest/run" \
            -H "Content-Type: application/json" \
            -H "X-Ingest-Token: ${{ secrets.INGEST_TOKEN }}" \
            -d "{\"mode\":\"$MODE\"}" \
            --max-time "$MAX_TIME" \
            -o /tmp/out.json \
            -w "%{http_code}")
          status=$?
          set -e

          cat /tmp/out.json || true
          echo
          echo "HTTP $code"
          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
