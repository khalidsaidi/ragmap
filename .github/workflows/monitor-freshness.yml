name: monitor-freshness

on:
  schedule:
    # Every 6 hours, offset to avoid clashing exactly with ingest/reachability schedules.
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check /rag/stats freshness
        run: |
          set -euo pipefail

          STATS="$(curl --fail-with-body -sS \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 30 \
            https://ragmap-api.web.app/rag/stats)"
          echo "$STATS" | jq .

          lastIngest="$(echo "$STATS" | jq -r '.lastSuccessfulIngestAt // empty')"
          lastReach="$(echo "$STATS" | jq -r '.lastReachabilityRunAt // empty')"

          if [[ -z "$lastIngest" || -z "$lastReach" ]]; then
            echo "ERROR: missing lastSuccessfulIngestAt or lastReachabilityRunAt"
            exit 1
          fi

          now="$(date +%s)"
          ingestEpoch="$(date -d "$lastIngest" +%s)"
          reachEpoch="$(date -d "$lastReach" +%s)"

          ingestAgeSec="$(( now - ingestEpoch ))"
          reachAgeSec="$(( now - reachEpoch ))"
          ingestAgeHours="$(( ingestAgeSec / 3600 ))"
          reachAgeHours="$(( reachAgeSec / 3600 ))"

          echo "Ingest age (sec): $ingestAgeSec"
          echo "Reachability age (sec): $reachAgeSec"
          echo "Ingest age (hours): $ingestAgeHours"
          echo "Reachability age (hours): $reachAgeHours"

          if (( ingestAgeSec > 48 * 3600 )); then
            echo "ERROR: ingest stale (>48h)"
            exit 1
          fi

          if (( reachAgeSec > 18 * 3600 )); then
            echo "ERROR: reachability stale (>18h)"
            exit 1
          fi

  stale_issue:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open or update stale-ingest issue when >48h
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          stats="$(curl --fail-with-body -sS \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 30 \
            https://ragmap-api.web.app/rag/stats)"

          last_ingest="$(echo "$stats" | jq -r '.lastSuccessfulIngestAt // empty')"
          if [[ -z "$last_ingest" ]]; then
            stale=1
            ingest_age_hours="unknown"
          else
            now="$(date +%s)"
            ingest_epoch="$(date -d "$last_ingest" +%s)"
            ingest_age_sec="$(( now - ingest_epoch ))"
            ingest_age_hours="$(( ingest_age_sec / 3600 ))"
            if (( ingest_age_sec > 48 * 3600 )); then
              stale=1
            else
              stale=0
            fi
          fi

          title="Passive alert: ingest stale >48h"
          existing="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"

          if [[ "$stale" -eq 0 ]]; then
            if [[ -n "$existing" ]]; then
              gh issue comment "$existing" --repo "$REPO" --body "Ingest freshness recovered at $(date -u +%Y-%m-%dT%H:%M:%SZ). lastSuccessfulIngestAt=\`$last_ingest\`."
              gh issue close "$existing" --repo "$REPO" --comment "Closing auto-opened stale-ingest issue after recovery."
            fi
            exit 0
          fi

          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          body="$(printf '%s\n' \
            'Ingest freshness check detected stale data.' \
            '' \
            "- \`lastSuccessfulIngestAt\`: \`${last_ingest:-missing}\`" \
            "- computed ingest age (hours): \`${ingest_age_hours}\`" \
            "- checked at (UTC): \`${checked_at}\`" \
            '- source: \`https://ragmap-api.web.app/rag/stats\`' \
            '' \
            'This issue is opened by \`.github/workflows/monitor-freshness.yml\` as a passive maintenance flag.')"

          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create \
              --repo "$REPO" \
              --title "$title" \
              --body "$body" \
              --label bug
          fi
