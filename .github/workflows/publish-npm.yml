name: publish-npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm -r install
      - run: pnpm -r build
      - name: Publish MCP local package
        run: |
          set -euo pipefail
          cd packages/mcp-local
          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            if npm publish --access public; then
              echo "Published with NPM token."
              exit 0
            fi
            echo "Token publish failed, trying trusted publishing via OIDC..."
          else
            echo "NPM_TOKEN missing, trying trusted publishing via OIDC..."
          fi
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public
