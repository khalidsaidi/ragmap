name: publish-npm

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version
      - run: npm ci
      - run: npm test
      - name: Publish (npm trusted publishing / OIDC)
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@khalidsaidi/ragmap-mcp@$version" version >/dev/null 2>&1; then
            echo "$version is already on npm"
          else
            npm publish --access public
          fi
      - name: List in the MCP Registry (GitHub OIDC)
        run: |
          curl -sL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
