name: publish-registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MCP publisher
        run: ./scripts/install-mcp-publisher.sh
      - name: Authenticate with GitHub OIDC
        run: ./bin/mcp-publisher login github-oidc
      - name: Publish server.json to MCP Registry
        run: ./bin/mcp-publisher publish packages/mcp-local/server.json
      # RAGMap is retired: the hosted backend is gone and the npm package is
      # deprecated. Keep every registry version marked deprecated so clients
      # see the warning. Remove this step if the project is ever revived.
      - name: Mark all registry versions deprecated
        run: |
          set -euo pipefail
          versions=$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers/io.github.khalidsaidi%2Fragmap/versions" \
            | jq -r '.servers[].server.version')
          for v in $versions; do
            echo "Deprecating io.github.khalidsaidi/ragmap@$v"
            ./bin/mcp-publisher status --status deprecated \
              --message "Hosted backend discontinued; npm package deprecated." \
              io.github.khalidsaidi/ragmap "$v"
          done
